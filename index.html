<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>dx</title>
    <link rel="stylesheet" href="style.css">
    <script src="dx.js"></script>

    <script>

    function roll(str) {
      let d = new Dice(str)
      let result = d.roll()
      
      document.getElementById('result').innerHTML =
        `<div>${str}: ${result}`
        +(document.getElementById('show_rolls').checked ? " ("+d.rolls.join(", ")+")" : "")
        +`</div>`
        + document.getElementById('result').innerHTML

      return result
    }
    
    </script>

    
  </head>
  <body>
    <div id="intro">
      <h1>dx</h1>
    <p>
        string: <input type="text" id="string" value="2d6"/>
        <input type="button" value="roll" onclick="roll(document.getElementById('string').value)"/>
    </p>
    <p>
        minimal value: <input type="text" id="min" value="1"/> 
        maximum value: <input type="text" id="max" value="6"/> 
        <input type="button" value="roll" onclick="roll('d'+(document.getElementById('max').value-document.getElementById('min').value+1)+'+'+(document.getElementById('min').value-1))"/>
    </p>
    <p>
        <input type="button" value="roll d4" onclick="roll('d4')"/>
        <input type="button" value="roll d6" onclick="roll('d6')"/>
        <input type="button" value="roll 2d6" onclick="roll('2d6')"/>
        <input type="button" value="roll 3d6" onclick="roll('3d6')"/>
        <input type="button" value="roll d8" onclick="roll('d8')"/>
        <input type="button" value="roll d10" onclick="roll('d10')"/>
        <input type="button" value="roll d12" onclick="roll('d12')"/>
        <input type="button" value="roll d20" onclick="roll('d20')"/>
        <input type="button" value="roll d100" onclick="roll('d100')"/>
    </p>
    <p>
        <input type="checkbox" id="show_rolls"/> show rolls
    </p>
    </div>

    <div>
      <hr/>
      <div id="result"></div>
    </div>


    <div style="color: lightgray">
    <hr/>
    dx - from <a href="https://berta.hu">berta.hu</a> - 2019
    </div>

    <script>roll('d6')</script>
    
  </body>
</html>
